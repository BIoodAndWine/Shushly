<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shushly — A quieter internet, in one tap | Free DNS Ad Blocker</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="Block ads and trackers with free, open-source DNS protection. No subscriptions, no telemetry, and no complicated setup. Available for Windows and Android." />
    <meta name="keywords" content="DNS ad blocker, DoH, DNS-over-HTTPS, adblocker, open source, Windows ad blocker, Android ad blocker, privacy, Control D, HaGeZi, OISD" />
    <meta name="author" content="Karl Molles" />
    <link rel="canonical" href="https://shushly-adblocker.web.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shushly-adblocker.web.app/" />
    <meta property="og:title" content="Shushly — A quieter internet, in one tap" />
    <meta property="og:description" content="Effortless, one-click DNS ad and tracker blocking. 100% free and open source." />
    <meta property="og:image" content="https://shushly-adblocker.web.app/shushly-logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://shushly-adblocker.web.app/" />
    <meta property="twitter:title" content="Shushly — A quieter internet, in one tap" />
    <meta property="twitter:description" content="Effortless, one-click DNS ad and tracker blocking. 100% free and open source." />
    <meta property="twitter:image" content="https://shushly-adblocker.web.app/shushly-logo.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/shushly-logo.png" />
    <link rel="apple-touch-icon" href="/shushly-logo.png" />
    <meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Anti-FOIT theme initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('shushly-theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-light-bg text-light-text dark:bg-dark-bg dark:text-dark-text antialiased selection:bg-shushly-sapphire selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
