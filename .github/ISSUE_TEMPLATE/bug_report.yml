name: Bug Report
description: File a bug report to help us improve Shushly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues before submitting.
  - type: input
    id: version
    attributes:
      label: Shushly Version
      description: What version of Shushly are you running? (e.g., v0.1.0)
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System & Platform
      description: Which operating system and platform is this occurring on?
      options:
        - Android 14+
        - Android 12-13
        - Android 8-11
        - Windows 11
        - Windows 10
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Protection Mode
      description: Which protection mode was active when the issue occurred?
      options:
        - Light (Default)
        - Balanced
        - Strict
        - Advanced Mode (Custom DoH)
        - Off / Disconnected
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open Shushly
        2. Tap the power toggle to activate
        3. Switch mode to...
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any error messages, logcat output, or attach screenshots if applicable.
    validations:
      required: false
