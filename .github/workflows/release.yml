name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Prepare Release APK & Checksum
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          mkdir -p dist
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk dist/Shushly-Android-${TAG}.apk
          cd dist
          sha256sum Shushly-Android-${TAG}.apk > Shushly-Android-${TAG}.apk.sha256

      - name: Upload Android Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Standalone Distributable
        run: .\gradlew.bat :composeApp:createDistributable --no-daemon

      - name: Package Windows ZIP & MSI
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name || inputs.tag_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # Compress standalone app folder
          $AppDir = "composeApp/build/compose/binaries/main/app/Shushly"
          $ZipPath = "dist/Shushly-Windows-Portable-$TAG.zip"
          Compress-Archive -Path "$AppDir\*" -DestinationPath $ZipPath -Force
          
          # Compute checksum
          $Hash = (Get-FileHash -Path $ZipPath -Algorithm SHA256).Hash.ToLower()
          "$Hash  Shushly-Windows-Portable-$TAG.zip" | Out-File -FilePath "$ZipPath.sha256" -Encoding ascii

      - name: Attempt MSI Build
        continue-on-error: true
        run: .\gradlew.bat :composeApp:packageMsi --no-daemon

      - name: Copy MSI if generated
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name || inputs.tag_name }}"
          $MsiFiles = Get-ChildItem -Path "composeApp/build/compose/binaries/main/msi/*.msi" -ErrorAction SilentlyContinue
          if ($MsiFiles) {
            $TargetMsi = "dist/Shushly-Windows-$TAG.msi"
            Copy-Item $MsiFiles[0].FullName -Destination $TargetMsi
            $Hash = (Get-FileHash -Path $TargetMsi -Algorithm SHA256).Hash.ToLower()
            "$Hash  Shushly-Windows-$TAG.msi" | Out-File -FilePath "$TargetMsi.sha256" -Encoding ascii
          }

      - name: Upload Windows Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Consolidate SHA256SUMS
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: Shushly ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
