name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Android Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SHUSHLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHUSHLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHUSHLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHUSHLY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository secrets for production release signing..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/shushly-release.jks"
            echo "SHUSHLY_KEYSTORE_PATH=$GITHUB_WORKSPACE/shushly-release.jks" >> $GITHUB_ENV
            echo "SHUSHLY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SHUSHLY_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "SHUSHLY_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Production secrets not configured; generating standard open-source release keystore..."
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/shushly-release.jks" \
              -alias shushly -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Shushly, OU=Release, O=Shushly, L=Global, ST=OpenSource, C=US" \
              -storepass shushly_ci_release -keypass shushly_ci_release
            echo "SHUSHLY_KEYSTORE_PATH=$GITHUB_WORKSPACE/shushly-release.jks" >> $GITHUB_ENV
            echo "SHUSHLY_KEYSTORE_PASSWORD=shushly_ci_release" >> $GITHUB_ENV
            echo "SHUSHLY_KEY_ALIAS=shushly" >> $GITHUB_ENV
            echo "SHUSHLY_KEY_PASSWORD=shushly_ci_release" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon

      - name: Prepare Android Release Asset & Checksum
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          mkdir -p dist
          # Locate release apk (signed or unsigned)
          APK_FILE=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK was not found!"
            exit 1
          fi
          cp "$APK_FILE" "dist/Shushly-Android-${TAG}.apk"
          cd dist
          sha256sum "Shushly-Android-${TAG}.apk" > "Shushly-Android-${TAG}.apk.sha256"

      - name: Upload Android Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*

  build-windows:
    name: Build Windows Application & MSI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
            echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Standalone Distributable & MSI Installer
        run: .\gradlew.bat :composeApp:createDistributable :composeApp:packageMsi --no-daemon

      - name: Package Windows ZIP & Collect MSI
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name || inputs.tag_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # Compress standalone app folder to Portable ZIP
          $AppDir = "composeApp/build/compose/binaries/main/app/Shushly"
          $ZipPath = "dist/Shushly-Windows-Portable-$TAG.zip"
          Compress-Archive -Path "$AppDir\*" -DestinationPath $ZipPath -Force
          $ZipHash = (Get-FileHash -Path $ZipPath -Algorithm SHA256).Hash.ToLower()
          "$ZipHash  Shushly-Windows-Portable-$TAG.zip" | Out-File -FilePath "$ZipPath.sha256" -Encoding ascii
          
          # Copy verified MSI installer
          $MsiFiles = Get-ChildItem -Path "composeApp/build/compose/binaries/main/msi/*.msi" -ErrorAction SilentlyContinue
          if ($MsiFiles) {
            $TargetMsi = "dist/Shushly-Windows-$TAG.msi"
            Copy-Item $MsiFiles[0].FullName -Destination $TargetMsi
            $MsiHash = (Get-FileHash -Path $TargetMsi -Algorithm SHA256).Hash.ToLower()
            "$MsiHash  Shushly-Windows-$TAG.msi" | Out-File -FilePath "$TargetMsi.sha256" -Encoding ascii
          } else {
            Write-Error "Windows MSI installer was not generated!"
            exit 1
          }

      - name: Upload Windows Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Consolidate SHA256SUMS
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: Shushly ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
